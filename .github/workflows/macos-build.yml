name: macOS Build & Smoke Test

on:
  push:
    branches: [master, main, "fix/**", "feat/**", "chore/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  OGRE_INSTALL_PREFIX: ${{ github.workspace }}/ext/ogre/install

jobs:
  build-and-smoke:
    name: macos-14 / GL3Plus (Ogre 14)
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install brew dependencies
        run: |
          brew update
          # Note: zziplib is no longer in Homebrew core (formula was removed).
          # Ogre detects ZZip as optional; without it, the OGRE zip codec is
          # skipped — fine for the smoke test, which doesn't use zip archives.
          brew install \
            cmake pkg-config ninja \
            sdl2 bullet xerces-c cli11 \
            freetype \
            ffmpeg
          # Report versions for the build log
          brew list --versions sdl2 bullet xerces-c cli11 freetype ffmpeg

      - name: Cache Ogre 14 build
        id: ogre-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.OGRE_INSTALL_PREFIX }}
          key: ogre14-macos14-glx-${{ hashFiles('.gitmodules') }}-${{ hashFiles('ext/ogre-source/OgreMain/CMakeLists.txt') }}-v2-nofi

      - name: Build Ogre 14 from submodule (dynamic)
        if: steps.ogre-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S ext/ogre-source -B ext/ogre/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${OGRE_INSTALL_PREFIX} \
            -DOGRE_BUILD_COMPONENT_BITES=ON \
            -DOGRE_BUILD_COMPONENT_OVERLAY=ON \
            -DOGRE_BUILD_COMPONENT_RTSHADERSYSTEM=ON \
            -DOGRE_BUILD_SAMPLES=OFF \
            -DOGRE_BUILD_TOOLS=OFF \
            -DOGRE_BUILD_PLUGIN_STBI=ON \
            -DOGRE_BUILD_PLUGIN_FREEIMAGE=OFF \
            -DOGRE_BUILD_PLUGIN_DOT_SCENE=OFF \
            -DOGRE_BUILD_PLUGIN_ASSIMP=OFF \
            -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=ON \
            -DOGRE_BUILD_RENDERSYSTEM_GL=OFF \
            -DOGRE_BUILD_RENDERSYSTEM_METAL=OFF \
            -DOGRE_INSTALL_PDB=OFF \
            -DOGRE_INSTALL_SAMPLES=OFF \
            -DOGRE_BUILD_DEPENDENCIES=OFF
          cmake --build ext/ogre/build -j 4
          cmake --install ext/ogre/build

      - name: Configure YARS
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee cmake-configure.log

      - name: Build YARS
        run: |
          set -o pipefail
          cmake --build build -j 4 2>&1 | tee build.log

      - name: Smoke test (--nogui, 100 iterations)
        run: |
          cd build
          ./bin/yars --iterations 100 --nogui --xml ../xml/braitenberg_nocontroller.xml

      - name: Smoke test with controller (--nogui, 100 iterations)
        run: |
          cd build
          ./bin/yars --iterations 100 --nogui --xml ../xml/braitenberg.xml

      - name: Reference CSV regression check (braitenberg_logging.xml)
        run: |
          cd build
          rm -f braitenberg-*.csv
          # macOS arm64 hits 2000 iters in ~5s. No external timeout
          # wrapper because BSD doesn't ship GNU `timeout`; the
          # --iterations flag is the stop condition.
          ./bin/yars --iterations 2000 --nogui --xml ../xml/braitenberg_logging.xml
          ACTUAL=$(ls -t braitenberg-*.csv | head -1)
          if [ -z "$ACTUAL" ]; then
            echo "No braitenberg-*.csv produced"
            exit 1
          fi
          mv "$ACTUAL" braitenberg_logging_actual.csv
          cd ..
          REF=xml/reference_logfile.macos-arm64.csv
          if [ ! -f "$REF" ]; then
            echo "::warning::No macOS arm64 reference committed yet. Uploading the produced CSV as artifact 'macos-arm64-reference-candidate' so it can be committed to $REF."
            cp build/braitenberg_logging_actual.csv macos-arm64-reference-candidate.csv
          else
            if diff -u "$REF" build/braitenberg_logging_actual.csv > csv-diff.log; then
              echo "CSV byte-identical to $REF."
            else
              echo "::error::CSV differs from $REF — see csv-diff.log artifact."
              head -50 csv-diff.log
              exit 1
            fi
          fi

      - name: Upload macOS arm64 reference candidate (only when ref missing)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-reference-candidate
          path: macos-arm64-reference-candidate.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Reference CSV regression check (hexapod_logging.xml)
        run: |
          cd build
          rm -f hexapod-*.csv
          # macOS arm64 hits 2000 iters in ~5s. No external timeout
          # wrapper because BSD doesn't ship GNU `timeout`; the
          # --iterations flag is the stop condition.
          ./bin/yars --iterations 2000 --nogui --xml ../xml/hexapod_logging.xml
          ACTUAL=$(ls -t hexapod-*.csv | head -1)
          if [ -z "$ACTUAL" ]; then
            echo "No hexapod-*.csv produced"
            exit 1
          fi
          mv "$ACTUAL" hexapod_logging_actual.csv
          cd ..
          REF=xml/reference_logfile_hexapod.macos-arm64.csv
          if [ ! -f "$REF" ]; then
            echo "::warning::No macOS arm64 hexapod reference committed yet. Uploading candidate artifact."
            cp build/hexapod_logging_actual.csv macos-arm64-hexapod-reference-candidate.csv
          else
            if diff -u "$REF" build/hexapod_logging_actual.csv > hexapod-csv-diff.log; then
              echo "Hexapod CSV byte-identical to $REF."
            else
              echo "::error::Hexapod CSV differs from $REF — see hexapod-csv-diff.log artifact."
              head -50 hexapod-csv-diff.log
              exit 1
            fi
          fi

      - name: Upload macOS hexapod reference candidate (only when ref missing)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-hexapod-reference-candidate
          path: macos-arm64-hexapod-reference-candidate.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-build-logs
          path: |
            cmake-configure.log
            build.log
            csv-diff.log
            hexapod-csv-diff.log
            build/braitenberg_logging_actual.csv
            build/hexapod_logging_actual.csv
          if-no-files-found: ignore

      - name: Performance trend (warn-only)
        continue-on-error: true
        run: |
          LINE=$(./scripts/perf-measure.sh build)
          echo "measured: $LINE"
          PLATFORM=$(echo "$LINE" | awk '{print $3}')
          SPS=$(echo "$LINE" | awk '{print $4}')
          git fetch origin ci-perf-history:ci-perf-history || {
            echo "::warning::ci-perf-history branch not on origin yet; skipping trend check"; exit 0; }
          git worktree add ../perf-history ci-perf-history
          HIST="../perf-history/perf/${PLATFORM}.log"
          touch "$HIST"
          ./scripts/perf-trend-check.sh "$HIST" "$SPS"
          echo "$LINE" >> "$HIST"
          cd ../perf-history
          git config user.name "yars-ci"
          git config user.email "ci@users.noreply.github.com"
          git add perf/ && git commit -m "perf: ${PLATFORM} $(echo "$LINE" | awk '{print $2, $4}')" || true
          # Linux and macOS jobs run on the same push and race on this
          # branch; rebase-retry so neither platform's point is lost.
          for i in 1 2 3; do
            git push origin ci-perf-history && break
            git pull --rebase origin ci-perf-history || true
            [ "$i" = "3" ] && echo "::warning::perf-history push failed after retries"
          done
