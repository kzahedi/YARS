name: macOS Build & Smoke Test

on:
  push:
    branches: [master, "fix/**", "feat/**", "chore/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  OGRE_INSTALL_PREFIX: ${{ github.workspace }}/ext/ogre/install

jobs:
  build-and-smoke:
    name: macos-14 / GL3Plus (Ogre 14)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install brew dependencies
        run: |
          brew update
          # Note: zziplib is no longer in Homebrew core (formula was removed).
          # Ogre detects ZZip as optional; without it, the OGRE zip codec is
          # skipped — fine for the smoke test, which doesn't use zip archives.
          brew install \
            cmake pkg-config ninja \
            sdl2 bullet xerces-c cli11 \
            freeimage freetype \
            ffmpeg
          # Report versions for the build log
          brew list --versions sdl2 bullet xerces-c cli11 freeimage freetype ffmpeg

      - name: Cache Ogre 14 build
        id: ogre-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OGRE_INSTALL_PREFIX }}
          key: ogre14-macos14-glx-${{ hashFiles('.gitmodules') }}-${{ hashFiles('ext/ogre-source/OgreMain/CMakeLists.txt') }}-v1

      - name: Build Ogre 14 from submodule (dynamic)
        if: steps.ogre-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S ext/ogre-source -B ext/ogre/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${OGRE_INSTALL_PREFIX} \
            -DOGRE_BUILD_COMPONENT_BITES=ON \
            -DOGRE_BUILD_COMPONENT_OVERLAY=ON \
            -DOGRE_BUILD_COMPONENT_RTSHADERSYSTEM=ON \
            -DOGRE_BUILD_SAMPLES=OFF \
            -DOGRE_BUILD_TOOLS=OFF \
            -DOGRE_BUILD_PLUGIN_STBI=ON \
            -DOGRE_BUILD_PLUGIN_DOT_SCENE=OFF \
            -DOGRE_BUILD_PLUGIN_ASSIMP=OFF \
            -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=ON \
            -DOGRE_BUILD_RENDERSYSTEM_GL=OFF \
            -DOGRE_BUILD_RENDERSYSTEM_METAL=OFF \
            -DOGRE_INSTALL_PDB=OFF \
            -DOGRE_INSTALL_SAMPLES=OFF \
            -DOGRE_BUILD_DEPENDENCIES=OFF
          cmake --build ext/ogre/build -j 4
          cmake --install ext/ogre/build

      - name: Configure YARS
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee cmake-configure.log

      - name: Build YARS
        run: |
          set -o pipefail
          cmake --build build -j 4 2>&1 | tee build.log

      - name: Smoke test (--nogui, 100 iterations)
        run: |
          cd build
          ./bin/yars --iterations 100 --nogui --xml ../xml/braitenberg_nocontroller.xml

      - name: Smoke test with controller (--nogui, 100 iterations)
        run: |
          cd build
          ./bin/yars --iterations 100 --nogui --xml ../xml/braitenberg.xml

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: |
            cmake-configure.log
            build.log
          if-no-files-found: ignore
